; MiniMax Desktop Buddy — Core2 firmware
; 两个环境:
;   native        → 在 Mac 上跑 lib/pet_state 的 Unity 单测(无需硬件)
;   m5stack-core2 → 真板固件(避开 native 时编译 Arduino 代码)

[platformio]
default_envs = m5stack-core2

; ---- 真板固件 ----
[env:m5stack-core2]
platform = espressif32@6.12.0
board = m5stack-core2
framework = arduino
upload_speed = 1500000
monitor_speed = 115200
board_build.partitions = default_16MB.csv
build_flags =
    -DBOARD_HAS_PSRAM
lib_deps =
    m5stack/M5Unified
    meganetaaan/M5Stack-Avatar

; ---- Mac 本地单测(纯逻辑,不编译 src/ 里的 Arduino 代码)----
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17
